<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 추천 챗봇</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141414;
    color: #fff;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* 왼쪽 사이드바 */
  .sidebar {
    width: 240px;
    background: #000000;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    border-right: 1px solid #222;
  }
  .sidebar .logo {
    color: #E50914;
    font-size: 28px;
    font-weight: 900;
    padding: 0 24px;
    margin-bottom: 30px;
    letter-spacing: -0.5px;
  }

  /* 새로운 채팅 버튼 */
  .new-chat-btn {
    width: calc(100% - 48px);
    margin: 0 24px 24px 24px;
    background: #E50914;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .new-chat-btn:hover { background: #f6121d; }

  .menu-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 24px;
  }
  .menu-item {
    padding: 10px 24px;
    color: #b3b3b3;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: color 0.2s;
  }
  .menu-item:hover { color: #fff; }

  /* 히스토리 영역 */
  .history-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    margin-bottom: 20px;
  }
  .history-section::-webkit-scrollbar { width: 4px; }
  .history-section::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  
  .history-title {
    padding: 0 24px;
    color: #808080;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
  }
  .history-item {
    padding: 10px 24px 10px 21px; 
    color: #b3b3b3;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.2s;
    border-left: 3px solid transparent;
  }
  .history-item:hover { color: #fff; }
  .history-item.active {
    color: #fff;
    border-left: 3px solid #E50914;
    background: linear-gradient(90deg, rgba(229,9,20,0.1) 0%, rgba(0,0,0,0) 100%);
  }

  .sidebar-bottom {
    margin-top: auto;
    padding: 0 24px;
  }
  .user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: #b3b3b3;
  }
  /* 프로필 원형 & 배경색 조정 */
  .user-avatar {
    width: 32px; height: 32px;
    background: #333;
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
  }

  /* 메인 컨텐츠 영역 */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
  }
  .content-area::-webkit-scrollbar { width: 8px; }
  .content-area::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* 초기 홈 화면 */
  #home-view { display: block; }
  .page-title { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
  .page-subtitle { color: #b3b3b3; font-size: 15px; margin-bottom: 24px; }
  
  /* 예시 질문 컨테이너 */
  .examples-container {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 40px;
  }
  .example-btn {
    background: #1f1f1f; border: 1px solid #333; color: #e5e5e5;
    padding: 10px 18px; border-radius: 24px; font-size: 14px;
    cursor: pointer; transition: all 0.2s; font-weight: 500;
  }
  .example-btn:hover {
    background: #E50914; border-color: #E50914; color: #fff;
  }

  .banner-container { display: flex; gap: 20px; margin-bottom: 50px; }
  .banner {
    flex: 1; background: #1f1f1f;
    padding: 24px; border-radius: 8px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; transition: background 0.2s;
  }
  .banner:hover { background: #2a2a2a; }
  .banner-icon { font-size: 24px; color: #E50914; }
  .banner-text h3 { font-size: 16px; margin-bottom: 4px; }
  .banner-text p { font-size: 13px; color: #808080; }

  .section-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
  .poster-grid { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 20px; }
  .poster-card {
    min-width: 160px; width: 160px;
    cursor: pointer; transition: transform 0.2s;
  }
  .poster-card:hover { transform: scale(1.05); }
  .poster-img {
    width: 100%; height: 240px;
    background: #333; border-radius: 8px;
    object-fit: cover; margin-bottom: 10px;
  }
  .poster-title { font-size: 14px; text-align: center; color: #e5e5e5; }

  /* 채팅 화면 */
  #chat-view { display: none; flex-direction: column; gap: 24px; padding-bottom: 40px; }
  .chat-row { display: flex; width: 100%; }
  .chat-row.user { justify-content: flex-end; }
  .chat-row.bot { justify-content: flex-start; gap: 16px; }
  
  .bot-avatar {
    width: 36px; height: 36px;
    background: #000; border-radius: 50%;
    color: #E50914; font-weight: 900; font-size: 18px;
    display: flex; justify-content: center; align-items: center;
    flex-shrink: 0;
  }
  
  .chat-bubble { max-width: 70%; font-size: 15px; line-height: 1.6; }
  .chat-row.user .chat-bubble {
    background: #E50914; color: #fff;
    padding: 12px 20px; border-radius: 20px 20px 4px 20px;
  }
  .chat-row.bot .chat-bubble { color: #e5e5e5; padding-top: 6px; }
  .chat-bubble p { margin-bottom: 8px; }
  .chat-bubble p:last-child { margin-bottom: 0; }

  .movie-recommendation-list {
    display: flex; gap: 12px; overflow-x: auto;
    margin-top: 16px; padding-bottom: 10px;
  }
  .movie-rec-card {
    display: flex; gap: 12px; background: #222;
    padding: 12px; border-radius: 8px;
    min-width: 280px; max-width: 280px;
  }
  .movie-rec-poster {
    width: 70px; height: 105px; border-radius: 4px;
    background: #444; object-fit: cover; flex-shrink: 0;
  }
  .movie-rec-info { display: flex; flex-direction: column; flex: 1; overflow: hidden;}
  .movie-rec-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movie-rec-meta { font-size: 12px; color: #aaa; margin-bottom: 6px; }
  .movie-rec-desc { font-size: 12px; color: #ccc; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* 하단 입력바 */
  .input-area {
    padding: 20px 60px 40px 60px;
    background: linear-gradient(0deg, #141414 70%, rgba(20,20,20,0) 100%);
  }
  .input-wrapper {
    display: flex; align-items: center;
    background: #2b2b2b;
    border-radius: 8px;
    padding: 8px 16px;
  }
  .input-wrapper input {
    flex: 1; background: transparent; border: none;
    color: #fff; font-size: 16px; padding: 12px 0;
    outline: none;
  }
  .input-wrapper input::placeholder { color: #808080; }
  .send-btn {
    background: transparent; border: none;
    color: #b3b3b3; cursor: pointer; padding: 8px;
    display: flex; justify-content: center; align-items: center;
    transition: color 0.2s;
  }
  .send-btn:hover { color: #fff; }
  .send-btn svg { width: 24px; height: 24px; fill: currentColor; }

  .loading::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } 100% { content: ""; } }
</style>
</head>
<body>

  <!-- 왼쪽 사이드바 -->
  <aside class="sidebar">
    <div class="logo">ASKFLIX</div>
    
    <!-- 새로운 채팅 버튼 -->
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      새로운 채팅
    </button>

    <div class="menu-group">
      <div class="menu-item" onclick="startNewChat()"><span>홈</span></div>
      <div class="menu-item"><span>검색</span></div>
      <div class="menu-item"><span>추천</span></div>
      <div class="menu-item"><span>마이 리스트</span></div>
    </div>
    
    <!-- 히스토리 영역 -->
    <div class="history-section">
      <div class="history-title">히스토리</div>
      <div class="history-list" id="history-list">
        <!-- 메시지를 전송하면 동적으로 이곳에 히스토리가 추가됩니다. -->
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="user-profile">
        <div class="user-avatar">
          <!-- 깔끔한 하얀색 사람 아이콘 (SVG) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span>민지</span>
      </div>
    </div>
  </aside>

  <!-- 메인 컨텐츠 -->
  <main class="main-content">
    <div class="content-area" id="content-area">
      
      <!-- 초기 홈 뷰 -->
      <div id="home-view">
        <h1 class="page-title">영화 추천 챗봇</h1>
        <p class="page-subtitle">좋아할 만한 영화를 찾아드릴게요.</p>
        
        <!-- 추가된 예시 질문 영역 -->
        <div class="examples-container">
          <button class="example-btn" onclick="send('긴장감 넘치는 스릴러 영화 추천해줘')">긴장감 넘치는 스릴러 영화 추천해줘</button>
          <button class="example-btn" onclick="send('우주 배경 SF 영화 추천')">우주 배경 SF 영화 추천</button>
          <button class="example-btn" onclick="send('반전 있는 영화 찾아줘')">반전 있는 영화 찾아줘</button>
          <button class="example-btn" onclick="send('가족과 보기 좋은 코미디')">가족과 보기 좋은 코미디</button>
        </div>

        <div class="banner-container">
          <div class="banner">
            <div class="banner-icon">🎯</div>
            <div class="banner-text">
              <h3>맞춤 추천</h3>
              <p>취향 분석 기반 추천</p>
            </div>
          </div>
          <div class="banner">
            <div class="banner-icon">🎬</div>
            <div class="banner-text">
              <h3>장르별 탐색</h3>
              <p>다양한 장르의 영화</p>
            </div>
          </div>
          <div class="banner">
            <div class="banner-icon">📖</div>
            <div class="banner-text">
              <h3>줄거리 보기</h3>
              <p>상세한 줄거리 제공</p>
            </div>
          </div>
        </div>

        <h2 class="section-title">추천 영화</h2>
        <div class="poster-grid">
          <div class="poster-card"><div class="poster-img"></div><div class="poster-title">드라이브</div></div>
          <div class="poster-card"><div class="poster-img"></div><div class="poster-title">블레이드 러너 2049</div></div>
          <div class="poster-card"><div class="poster-img"></div><div class="poster-title">시카리오</div></div>
          <div class="poster-card"><div class="poster-img"></div><div class="poster-title">인셉션</div></div>
          <div class="poster-card"><div class="poster-img"></div><div class="poster-title">다크 나이트</div></div>
        </div>
      </div>

      <!-- 채팅 뷰 -->
      <div id="chat-view">
        <div class="chat-row bot">
          <div class="bot-avatar">N</div>
          <div class="chat-bubble">
            <p>안녕하세요! 어떤 영화를 찾고 계신가요?</p>
          </div>
        </div>
      </div>
      
    </div>

    <!-- 하단 입력창 -->
    <div class="input-area">
      <div class="input-wrapper">
        <input id="input" type="text" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') send()">
        <button class="send-btn" onclick="send()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>

<script>
  const contentArea = document.getElementById("content-area");
  const homeView = document.getElementById("home-view");
  const chatView = document.getElementById("chat-view");
  const historyList = document.getElementById("history-list");
  
  let isChatActive = false;
  let isFirstMessageInSession = true; // 현재 세션의 첫 메시지인지 추적

  // 새로운 채팅 시작 (화면 초기화)
  function startNewChat() {
    isChatActive = false;
    isFirstMessageInSession = true; // 세션 초기화
    homeView.style.display = "block";
    chatView.style.display = "none";
    
    // 채팅 내용 초기화 (기본 인사말만 남김)
    chatView.innerHTML = `
      <div class="chat-row bot">
        <div class="bot-avatar">N</div>
        <div class="chat-bubble"><p>안녕하세요! 어떤 영화를 찾고 계신가요?</p></div>
      </div>
    `;
    
    // 사이드바 활성화 표시 해제
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
  }

  // 히스토리에 새 항목 추가
  function addToHistory(text) {
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
    
    const item = document.createElement("div");
    item.className = "history-item active";
    item.textContent = text;
    
    // 리스트의 맨 위에 추가
    historyList.insertBefore(item, historyList.firstChild);
  }

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "chat-row " + role;
    
    if (role === "bot") {
      row.innerHTML = `<div class="bot-avatar">N</div><div class="chat-bubble">${marked.parse(text)}</div>`;
    } else {
      row.innerHTML = `<div class="chat-bubble">${text}</div>`;
    }
    
    chatView.appendChild(row);
    contentArea.scrollTop = contentArea.scrollHeight;
    return row;
  }

  function addMovieCardsBubble(text, movies) {
    const row = document.createElement("div");
    row.className = "chat-row bot";
    let cardsHTML = movies.map(movie => `
      <div class="movie-rec-card">
        <img src="${movie.posterPath}" class="movie-rec-poster" alt="${movie.title}">
        <div class="movie-rec-info">
          <div class="movie-rec-title">${movie.title}</div>
          <div class="movie-rec-meta">${movie.year} · ${movie.genre}<br>⭐ ${movie.rating}</div>
          <div class="movie-rec-desc">${movie.desc}</div>
        </div>
      </div>
    `).join("");

    row.innerHTML = `
      <div class="bot-avatar">N</div>
      <div class="chat-bubble">
        <p>${text}</p>
        <div class="movie-recommendation-list">${cardsHTML}</div>
      </div>
    `;
    chatView.appendChild(row);
    contentArea.scrollTop = contentArea.scrollHeight;
  }

  // 직접 질문 텍스트를 파라미터로 받을 수 있게 설정 (예시 버튼용)
  async function send(queryText = null) {
    const input = document.getElementById("input");
    const q = queryText || input.value.trim();
    if (!q) return;
    input.value = "";

    // 새 대화 화면으로 전환
    if (!isChatActive) {
      homeView.style.display = "none";
      chatView.style.display = "flex";
      isChatActive = true;
    }

    // 세션의 첫 질문일 경우 히스토리에 등록
    if (isFirstMessageInSession) {
      addToHistory(q);
      isFirstMessageInSession = false;
    }

    addBubble("user", q);

    const row = addBubble("bot", "");
    const bubbleTextContainer = row.querySelector(".chat-bubble");
    bubbleTextContainer.innerHTML = '<span class="loading"></span>';
    let fullText = "", first = true;

    try {
      const res = await fetch("http://127.0.0.1:8000/chat/stream", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q })
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (first) { bubbleTextContainer.innerHTML = ""; first = false; }
        fullText += decoder.decode(value);
        bubbleTextContainer.innerHTML = marked.parse(fullText);
        contentArea.scrollTop = contentArea.scrollHeight;
      }
    } catch (e) {
      bubbleTextContainer.innerHTML = "⚠️ 서버에 연결하지 못했어요.";
    }
  }
</script>
</body>
</html>
