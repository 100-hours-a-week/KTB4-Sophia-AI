<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASKFLIX 챗봇</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f2f2f2;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  /* 폰 전체 틀 */
  .phone {
    width: 380px; height: 720px;
    background: #141414;
    border-radius: 36px;
    border: 10px solid #000;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(229,9,20,.25);
  }

  /* 상단 헤더 */
  .header {
    background: #000;
    padding: 16px; text-align: center;
    border-bottom: 1px solid #222;
  }
  .header .logo {
    color: #E50914; font-weight: 900; font-size: 22px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .header .sub {
    color: #808080; font-size: 12px; margin-top: 2px;
  }

  /* 메시지 영역 (여기만 스크롤) */
  .messages {
    flex: 1; overflow-y: auto;
    padding: 14px;
    background: #141414;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .row { display: flex; margin: 8px 0; }
  .row.user { justify-content: flex-end; }
  .row.bot  { justify-content: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; max-width: 78%;
    font-size: 14px; line-height: 1.55; word-break: break-word;
  }
  .bubble.user { background: #E50914; color: #fff; border-bottom-right-radius: 4px; }
  .bubble.bot  { background: #2b2b2b; color: #f5f5f5; border-bottom-left-radius: 4px; }
  .bubble.bot p  { margin: 0 0 6px; }
  .bubble.bot p:last-child { margin: 0; }
  .bubble.bot h1, .bubble.bot h2, .bubble.bot h3 {
    font-size: 15px; margin: 8px 0 4px; color: #fff;
  }
  .bubble.bot strong { color: #fff; }
  .bubble.bot ul, .bubble.bot ol { margin: 4px 0; padding-left: 18px; }

  /* 예시 질문 버튼 */
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; }
  .examples button {
    background: transparent; border: 1px solid #E50914; color: #E50914;
    padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    font-weight: 600;
  }
  .examples button:hover { background: #E50914; color: #fff; }

  /* 하단 입력칸 */
  .inputbar {
    display: flex; gap: 8px; padding: 12px;
    background: #000; border-top: 1px solid #222;
  }
  .inputbar input {
    flex: 1; padding: 10px 14px; border: 1px solid #333;
    border-radius: 6px; font-size: 14px; outline: none;
    background: #2b2b2b; color: #fff;
  }
  .inputbar input::placeholder { color: #888; }
  .inputbar input:focus { border-color: #E50914; }
  .inputbar button {
    background: #E50914; color: #fff; border: none;
    padding: 0 18px; border-radius: 6px; font-size: 14px; cursor: pointer;
    font-weight: 700;
  }
  .inputbar button:hover { background: #f6121d; }
  .typing { color: #808080; font-size: 13px; padding: 4px 8px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="logo">ASKFLIX</div>
      <div class="sub">영화 추천 챗봇</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="메시지를 입력하세요"
             onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">전송</button>
    </div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:8000/chat";
  const EXAMPLES = ["SF 영화 추천해줘", "반전 있는 스릴러 추천",
                    "인터스텔라 어떤 영화야?", "인터스텔라 결말 알려줘"];
  const box = document.getElementById("messages");

  // 말풍선 하나 추가
  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.innerHTML = role === "bot" ? marked.parse(text) : text;
    row.appendChild(bubble);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;   // 항상 맨 아래로 스크롤
    return row;
  }

  // 첫 인사 + 예시 버튼
  function greet() {
    addBubble("bot", "안녕하세요! 🎬 무엇을 보고 싶으신가요? 취향을 말씀해 주시면 딱 맞는 작품을 찾아드릴게요.\n\n아래 예시를 눌러보거나, 직접 질문을 입력해보세요!");
    const wrap = document.createElement("div");
    wrap.className = "examples";
    wrap.id = "examples";
    EXAMPLES.forEach(ex => {
      const b = document.createElement("button");
      b.textContent = ex;
      b.onclick = () => { document.getElementById("input").value = ex; send(); };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  }

  // 질문 보내기
  async function send() {
    const input = document.getElementById("input");
    const q = input.value.trim();
    if (!q) return;
    input.value = "";

    // 예시 버튼 숨기기
    const ex = document.getElementById("examples");
    if (ex) ex.remove();

    addBubble("user", q);

    // "입력 중..." 표시
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "답변 생성 중...";
    box.appendChild(typing);
    box.scrollTop = box.scrollHeight;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      typing.remove();
      addBubble("bot", data.answer);
    } catch (e) {
      typing.remove();
      addBubble("bot", "⚠️ 서버에 연결하지 못했어요. FastAPI 서버가 켜져 있는지 확인해주세요.");
    }
  }

  greet();
</script>
</body>
</html>
